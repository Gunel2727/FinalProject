<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Şifrəni unutmusan? — SIS</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="js/api.js"></script>
</head>
<body>
<a href="index.html" style="position:fixed;top:20px;left:24px;font-size:13px;color:var(--text-muted);text-decoration:none;font-weight:600">← Ana səhifə</a>
<button class="theme-toggle theme-toggle-fixed" onclick="toggleTheme()" title="Tema dəyiş" aria-label="Tema dəyiş">
  <span class="icon-sun">☀</span><span class="icon-moon">☾</span>
</button>
<div class="auth-wrap" x-data="forgotPage()">
  <div class="auth-card">
    <div class="auth-icon">&#9889;</div>

    <template x-if="!sent">
      <div>
        <h1>Şifrəni unutmusan?</h1>
        <p class="sub">Email ünvanını yaz, sıfırlama linki göndərək.</p>

        <div class="alert alert-error" x-show="error" x-text="error"></div>

        <form @submit.prevent="submit">
          <div class="form-row">
            <label>Email</label>
            <input type="email" x-model="email" required autocomplete="username">
          </div>
          <button type="submit" class="btn btn-primary" :disabled="loading">
            <span x-show="!loading">Sıfırlama linki göndər</span>
            <span x-show="loading">Göndərilir...</span>
          </button>
        </form>
      </div>
    </template>

    <template x-if="sent">
      <div style="text-align:center">
        <h1>Emailini yoxla</h1>
        <p class="sub">Əgər bu email sistemdə mövcuddursa, sıfırlama linki göndərildi. Link 15 dəqiqə etibarlıdır.</p>
        <button class="btn btn-secondary" style="width:100%;margin-top:10px" @click="sent=false">Başqa email yaz</button>
      </div>
    </template>

    <div class="switch"><a href="login.html">← Girişə qayıt</a></div>
  </div>
</div>

<script>
function forgotPage() {
  return {
    email: "",
    error: "",
    loading: false,
    sent: false,

    async submit() {
      this.error = "";
      this.loading = true;
      try {
        await apiRequest("/auth/forgot-password", "POST", { email: this.email });
        this.sent = true;
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Şifrəni sıfırla — SIS</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="js/api.js"></script>
</head>
<body>
<a href="index.html" style="position:fixed;top:20px;left:24px;font-size:13px;color:var(--text-muted);text-decoration:none;font-weight:600">← Ana səhifə</a>
<button class="theme-toggle theme-toggle-fixed" onclick="toggleTheme()" title="Tema dəyiş" aria-label="Tema dəyiş">
  <span class="icon-sun">☀</span><span class="icon-moon">☾</span>
</button>
<div class="auth-wrap" x-data="resetPage()" x-init="init()">
  <div class="auth-card">
    <div class="auth-icon">&#9889;</div>
    <h1>Yeni şifrə təyin et</h1>
    <p class="sub" x-text="email ? ('Hesab: ' + email) : 'Bu linkin etibarlılığı 15 dəqiqədir.'"></p>

    <div class="alert alert-error" x-show="error" x-text="error"></div>
    <div class="alert alert-success" x-show="success" x-text="success"></div>

    <form @submit.prevent="submit" x-show="!success">
      <div class="form-row">
        <label>Yeni şifrə</label>
        <input type="password" x-model="newPassword" required minlength="6">
      </div>
      <div class="form-row">
        <label>Yeni şifrəni təkrarla</label>
        <input type="password" x-model="confirmPassword" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" :disabled="loading || !email || !token">
        <span x-show="!loading">Şifrəni sıfırla</span>
        <span x-show="loading">Yenilənir...</span>
      </button>
    </form>

    <div class="switch"><a href="login.html">← Girişə qayıt</a></div>
  </div>
</div>

<script>
function resetPage() {
  return {
    email: "",
    token: "",
    newPassword: "",
    confirmPassword: "",
    error: "",
    success: "",
    loading: false,

    init() {
      // Link Email-də bu formatda gəlir: reset-password.html?email=...&token=...
      const params = new URLSearchParams(window.location.search);
      this.email = params.get("email") || "";
      this.token = params.get("token") || "";
      if (!this.email || !this.token) {
        this.error = "Link natamamdır. Email-dəki linkin tam URL-ini istifadə et.";
      }
    },

    async submit() {
      this.error = "";
      if (this.newPassword !== this.confirmPassword) {
        this.error = "Şifrələr üst-üstə düşmür";
        return;
      }
      this.loading = true;
      try {
        await apiRequest("/auth/reset-password", "POST", {
          email: this.email,
          resetToken: this.token,
          newPassword: this.newPassword
        });
        this.success = "Şifrəniz dəyişdirildi. İndi yeni şifrə ilə daxil ola bilərsiniz.";
        setTimeout(() => window.location.href = "login.html", 1800);
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>

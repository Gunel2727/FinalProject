<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Şifrəni dəyiş — SIS</title>
<link rel="stylesheet" href="css/style.css">
<script src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js" defer></script>
<script src="js/api.js"></script>
</head>
<body>
<button class="theme-toggle theme-toggle-fixed" onclick="toggleTheme()" title="Tema dəyiş" aria-label="Tema dəyiş">
  <span class="icon-sun">☀</span><span class="icon-moon">☾</span>
</button>
<div class="auth-wrap" x-data="forceChangePage()" x-init="init()">
  <div class="auth-card">
    <div class="auth-icon">&#9889;</div>

    <div style="background:var(--amber-light);color:var(--amber);border-radius:8px;padding:10px 12px;font-size:12.5px;margin-bottom:16px">
      İlk dəfə daxil olursunuz — təhlükəsizlik üçün müvəqqəti şifrənizi dəyişməlisiniz.
    </div>

    <h1>Şifrəni dəyiş</h1>
    <p class="sub">Bu şifrəni bundan sonra hər girişdə istifadə edəcəksiniz.</p>

    <div class="alert alert-error" x-show="error" x-text="error"></div>

    <form @submit.prevent="submit">
      <div class="form-row">
        <label>Müvəqqəti şifrə</label>
        <input type="password" x-model="oldPassword" required>
      </div>
      <div class="form-row">
        <label>Yeni şifrə</label>
        <input type="password" x-model="newPassword" required minlength="6">
      </div>
      <div class="form-row">
        <label>Yeni şifrəni təkrarla</label>
        <input type="password" x-model="confirmPassword" required minlength="6">
      </div>
      <button type="submit" class="btn btn-primary" :disabled="loading">
        <span x-show="!loading">Şifrəni dəyiş və yenidən daxil ol</span>
        <span x-show="loading">Yenilənir...</span>
      </button>
    </form>
  </div>
</div>

<script>
function forceChangePage() {
  return {
    oldPassword: "",
    newPassword: "",
    confirmPassword: "",
    error: "",
    loading: false,

    init() {
      // Bu səhifə yalnız login olmuş istifadəçi üçündür
      if (!getToken()) window.location.href = "login.html";
    },

    async submit() {
      this.error = "";
      if (this.newPassword !== this.confirmPassword) {
        this.error = "Yeni şifrələr üst-üstə düşmür";
        return;
      }
      this.loading = true;
      try {
        await apiRequest("/auth/change-password", "POST", {
          oldPassword: this.oldPassword,
          newPassword: this.newPassword
        });
        // Token hələ "mustChangePassword: true" daşıyır (JWT dəyişmir) —
        // yeni, düzgün token almaq üçün yenidən login lazımdır
        clearCurrentUser();
        alert("Şifrəniz dəyişdirildi. İndi yeni şifrənizlə daxil olun.");
        window.location.href = "login.html";
      } catch (e) {
        this.error = e.message;
      } finally {
        this.loading = false;
      }
    }
  };
}
</script>
</body>
</html>
